<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow"><title>Admin sign in | CivicTrack AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body><main class="admin-login-page py-5"><div class="container"><section class="admin-login-card mx-auto">
    <a class="navbar-brand fw-semibold text-decoration-none" href="/">CivicTrack <span class="brand-ai">AI</span></a>
    <div class="eyebrow mt-4"><span class="eyebrow-dot"></span> RESTRICTED ACCESS</div><h1 class="h3 fw-bold mt-3">Admin sign in</h1>
    {% if not admin_configured %}<div class="alert alert-warning" role="status">Admin login is not configured yet. Set ADMIN_USERNAME and ADMIN_PASSWORD_HASH in your local environment, then restart the app.</div>{% endif %}
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" class="mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required maxlength="120"></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary rounded-pill px-4" type="submit" {% if not admin_configured %}disabled{% endif %}>Sign in</button>
    </form><a class="small d-inline-block mt-4" href="/">Return to public site</a>
</section></div></main></body></html>
